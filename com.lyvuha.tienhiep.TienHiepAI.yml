id: com.lyvuha.tienhiep.TienHiepAI
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: tienhiepai
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --socket=pulseaudio

modules:
  - name: tienhiepai
    buildsystem: simple
    build-commands:
      - mkdir -p /app/tienhiepai /app/share
      - cp -r app/* /app/tienhiepai/
      - install -Dm755 bin/tienhiepai /app/bin/tienhiepai
      - cp -r share/* /app/share/
    sources:
      - type: archive
        url: https://github.com/congkx123789/tienhiep-releases/releases/download/v0.11.27/TienHiepAI-linux-x86_64-0.11.27.tar.gz
        sha256: 5462942a2a3cba55a4a1dced4abc519911ca765ebfe8d52b401d0b96ec14067b